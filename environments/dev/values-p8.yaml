global:
  namespace: sa-p8
  imagePullSecrets:
    - name: ghcr-pull-secret
  rolloutNonce: "2026-09-17-integration-v5"

externalSecrets:
  enabled: true
  secretStoreName: cluster-secret-store
  refreshInterval: 1h

api-gateway:
  fullnameOverride: api-gateway
  image:
    repository: ghcr.io/izabel05/sa-api-gateway
    tag: v1.2.2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  service:
    type: ClusterIP
    port: 8080
  rollout:
    enabled: true
    stableService: api-gateway
    canaryService: api-gateway-canary
    maxSurge: 100%
    maxUnavailable: 0
    steps:
      - setWeight: 20
      - pause: {duration: 30s}
      - analysis: {templates: [{templateName: gateway-integration}]}
      - setWeight: 50
      - pause: {duration: 30s}
      - analysis: {templates: [{templateName: gateway-integration}]}
      - setWeight: 80
      - pause: {duration: 30s}
      - analysis: {templates: [{templateName: gateway-integration}]}

autenticacion-ms:
  fullnameOverride: autenticacion-ms
  image:
    repository: ghcr.io/izabel05/sa-autenticacion-ms
    tag: v1.2.2
  auth:
    secretName: jwt-credentials

catalogo-ms:
  fullnameOverride: catalogo-ms
  image:
    repository: ghcr.io/izabel05/sa-catalogo-ms
    tag: v1.2.2

prestamos-ms:
  fullnameOverride: prestamos-ms
  image:
    repository: ghcr.io/izabel05/sa-prestamos-ms
    tag: v1.2.2

multas-ms:
  fullnameOverride: multas-ms
  image:
    repository: ghcr.io/izabel05/sa-multas-ms
    tag: v1.2.2

cronjob2:
  image:
    repository: ghcr.io/izabel05/sa-cronjobs-worker
    tag: v1.2.2

summaryConsumer:
  image:
    repository: ghcr.io/izabel05/sa-cronjobs-worker
    tag: v1.2.2
