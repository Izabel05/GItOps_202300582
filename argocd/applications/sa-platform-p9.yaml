apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform-p9
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sa-platform-p9
    app.kubernetes.io/managed-by: gitops
spec:
  project: default
  source:
    repoURL: https://github.com/Izabel05/GItOps_202300582.git
    targetRevision: main
    path: charts/sa-platform
    helm:
      valueFiles:
        - values-p9.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p9
  ignoreDifferences:
    - group: ""
      kind: Service
      name: api-gateway
      namespace: sa-p9
      jsonPointers: [/spec/selector]
    - group: ""
      kind: Service
      name: api-gateway-canary
      namespace: sa-p9
      jsonPointers: [/spec/selector]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
