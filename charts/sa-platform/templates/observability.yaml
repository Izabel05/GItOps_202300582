apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sa-p10-services
  namespace: {{ .Values.global.namespace }}
  labels: {release: observability}
spec:
  namespaceSelector: {matchNames: [{{ .Values.global.namespace }}]}
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api-gateway, catalogo-ms, prestamos-ms, multas-ms]
  endpoints: [{port: http, path: /metrics, interval: 15s}]
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sa-p10-slos
  namespace: {{ .Values.global.namespace }}
  labels: {release: observability}
spec:
  groups:
    - name: sa-p10.slo.recording
      interval: 30s
      rules:
        - record: sa:slo_availability:error_ratio_5m
          expr: sum(rate(library_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(library_http_requests_total[5m])), 0.001)
        - record: sa:slo_availability:error_budget_consumed
          expr: sa:slo_availability:error_ratio_5m / (1 - 0.995)
        - record: sa:slo_latency:bad_ratio_5m
          expr: 1 - (sum(rate(library_http_request_duration_seconds_bucket{le="0.75"}[5m])) / clamp_min(sum(rate(library_http_request_duration_seconds_count[5m])), 0.001))
        - record: sa:slo_latency:error_budget_consumed
          expr: sa:slo_latency:bad_ratio_5m / (1 - 0.95)
    - name: sa-p10.slo.alerts
      rules:
        - alert: AvailabilityErrorBudgetFastBurn
          expr: sa:slo_availability:error_budget_consumed > 14.4
          for: 2m
          labels: {severity: critical, slo: availability}
          annotations:
            summary: Presupuesto de disponibilidad consumiéndose rápidamente
            runbook_url: https://github.com/Izabel05/Practicas-SA-B-202300582/blob/main/P10/runbooks/availability-fast-burn.md
        - alert: LatencyErrorBudgetFastBurn
          expr: sa:slo_latency:error_budget_consumed > 14.4
          for: 2m
          labels: {severity: critical, slo: latency}
          annotations:
            summary: Presupuesto de latencia consumiéndose rápidamente
            runbook_url: https://github.com/Izabel05/Practicas-SA-B-202300582/blob/main/P10/runbooks/latency-fast-burn.md
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p10-traffic-generator
  namespace: {{ .Values.global.namespace }}
  labels: {app.kubernetes.io/name: p10-traffic-generator}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: p10-traffic-generator}}
  template:
    metadata: {labels: {app.kubernetes.io/name: p10-traffic-generator}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 100, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: traffic
          image: curlimages/curl:8.10.1
          command: [sh, -c]
          args: ['while true; do curl -fsS --max-time 5 http://api-gateway-canary:8080/health/catalogo >/dev/null || true; sleep 1; done']
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: p10-observability-egress, namespace: {{ .Values.global.namespace }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}}]
      ports: [{protocol: TCP, port: 4318}, {protocol: TCP, port: 9090}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: p10-traffic-to-gateway, namespace: {{ .Values.global.namespace }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: p10-traffic-generator}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: api-gateway}}}]
      ports: [{protocol: TCP, port: 8080}]
