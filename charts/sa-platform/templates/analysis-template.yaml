{{- $gateway := index .Values "api-gateway" }}
{{- if $gateway.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: gateway-slo-prometheus
  namespace: {{ .Values.global.namespace }}
spec:
  args:
    - name: latest-hash
  metrics:
    - name: candidate-error-rate
      interval: 20s
      count: 4
      failureLimit: 1
      successCondition: len(result) > 0 && result[0] < 0.05
      provider:
        prometheus:
          address: http://observability-kube-prometh-prometheus.observability.svc.cluster.local:9090
          query: |
            (sum(rate(library_http_requests_total{service="api-gateway",revision="{{ "{{args.latest-hash}}" }}",status_code=~"5.."}[2m])) or vector(0))
            / clamp_min((sum(rate(library_http_requests_total{service="api-gateway",revision="{{ "{{args.latest-hash}}" }}"}[2m])) or vector(0)), 0.001)
    - name: candidate-p95-latency
      interval: 20s
      count: 4
      failureLimit: 1
      successCondition: len(result) > 0 && result[0] < 0.75
      provider:
        prometheus:
          address: http://observability-kube-prometh-prometheus.observability.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(library_http_request_duration_seconds_bucket{service="api-gateway",revision="{{ "{{args.latest-hash}}" }}"}[2m]))
            ) or vector(0)
{{- end }}
